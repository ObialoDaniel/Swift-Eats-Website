# ============================================
# VOLUMES
# ============================================
volumes:
  maven-repo:
    driver: local
  swift_postgres_data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  swift-network:
    driver: bridge

services:
  # ============================================
  # DATABASE
  # ============================================
  swift-db:
    image: postgres:17      # <-- STABLE version (no breaking storage changes)
    container_name: swift-service-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: swiftdb
    ports:
      - "5436:5432"
    volumes:
      - swift_postgres_data:/var/lib/postgresql   # <-- FIXED for Postgres 17+ & 18+
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swift-network

  # ============================================
  # APPLICATION
  # ============================================
  swift-eats:
    build:
      context: ./swift-eats
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1

    container_name: swift-eats
    restart: always

    depends_on:
      swift-db:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://swift-db:5432/swiftdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 604800000

    ports:
      - "8000:8080"

    networks:
      - swift-network